apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flask-route
  namespace: kube-training
spec:
  hostnames:
    - flask.local
  parentRefs:
    - name: flask-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: flask-app
          port: 80
