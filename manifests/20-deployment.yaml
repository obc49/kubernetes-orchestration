apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: kube-training
  labels:
    app.kubernetes.io/name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-app
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: flask-app
      containers:
        - name: flask-app
          # Au TP03, remplacez cette image par celle publiée au TP01.
          image: ghcr.io/oumar49/kubernetes-orchestration:remplacer-au-tp01
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: flask-app-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: flask-app-secret
                  key: API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 10
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
